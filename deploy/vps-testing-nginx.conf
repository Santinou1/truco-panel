# HTTP bootstrap: enable this site, then run certbot --nginx for this domain.
map $http_upgrade $pulperia_testing_panel_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name testingpanel.lapulperia.cloud;
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pulperia_testing_panel_connection;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
